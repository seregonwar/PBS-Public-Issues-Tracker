name: "Feature Request"
description: "Suggest an improvement or new capability for PBS or PBS Studio."
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        We welcome focused, actionable feature requests. Please search existing issues first and describe the user problem, not only the proposed implementation.

        Do not use this form for exploit, jailbreak or piracy assistance.
  - type: dropdown
    id: component
    attributes:
      label: Target component
      options:
        - PBS - PS4 payload
        - PBS - PS5 payload
        - PBS Web Dashboard
        - PBS Studio
        - PBS Studio plugin integration
        - Multiple components
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What limitation are you encountering, and who would benefit?
      placeholder: "When I try to ..., I cannot ..., which makes ... difficult."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Explain the requested behavior and what a successful implementation would look like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: Have you tried another approach? What are its limitations?
  - type: textarea
    id: details
    attributes:
      label: Additional context
      description: Optional mockups, screenshots, references, platforms, or related issues. Do not include secrets or personal information.
  - type: checkboxes
    id: confirmation
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find an equivalent request.
          required: true
        - label: This request focuses on one feature or closely related workflow.
          required: true
